name: Deploy to IONOS (SFTP)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets
        env:
          S: ${{ secrets.SFTP_SERVER }}
          U: ${{ secrets.SFTP_USERNAME }}
          P: ${{ secrets.SFTP_PASSWORD }}
          R: ${{ secrets.SFTP_REMOTE_PATH }}
        run: |
          for v in S U P R; do
            if [ -z "${!v}" ]; then echo "::error::Secret fehlt oder leer (S=SFTP_SERVER, U=SFTP_USERNAME, P=SFTP_PASSWORD, R=SFTP_REMOTE_PATH): $v"; fail=1; fi
          done
          [ -z "$fail" ]

      # Nur die Dateien bereitstellen, die auf den Server gehören
      - name: Prepare deploy folder
        run: |
          mkdir _deploy
          rsync -a ./ _deploy/ \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '_deploy' \
            --exclude '*.md' \
            --exclude 'gitignore.txt' \
            --exclude 'htaccess.txt' \
            --exclude 'uploads' \
            --exclude 'database'

      - name: Upload via SFTP (lftp)
        env:
          SFTP_SERVER: ${{ secrets.SFTP_SERVER }}
          SFTP_USERNAME: ${{ secrets.SFTP_USERNAME }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
          SFTP_REMOTE_PATH: ${{ secrets.SFTP_REMOTE_PATH }}
        run: |
          sudo apt-get install -y lftp >/dev/null
          lftp -u "$SFTP_USERNAME","$SFTP_PASSWORD" -p 22 "sftp://$SFTP_SERVER" <<EOF
          set sftp:auto-confirm yes
          set net:max-retries 2
          set cmd:fail-exit yes
          mirror -R --verbose=1 --parallel=4 ./_deploy "$SFTP_REMOTE_PATH"
          bye
          EOF
